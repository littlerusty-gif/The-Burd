<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Paper-cut multi-layered drop shadows -->
    <filter id="shadow-outer" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0b1021" flood-opacity="0.55"/>
    </filter>
    <filter id="shadow-layer" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-2" dy="4" stdDeviation="5" flood-color="#0b1021" flood-opacity="0.45"/>
    </filter>
    <filter id="shadow-pin" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0b1021" flood-opacity="0.5"/>
    </filter>
    <filter id="shadow-eye" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-1" dy="4" stdDeviation="4" flood-color="#0b1021" flood-opacity="0.4"/>
    </filter>
    <filter id="glow-mint" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner Circle Clip -->
    <clipPath id="inner-circle-clip">
      <circle cx="250" cy="235" r="185" />
    </clipPath>
  </defs>

  <!-- Outer Deep Navy Rim with Map Pin Point at 6 o'clock (#1c204b) -->
  <path d="M 250 50 
           A 195 195 0 1 1 166 414 
           L 250 468 
           L 334 414 
           A 195 195 0 0 1 250 50 Z" 
        fill="#1c204b" 
        filter="url(#shadow-outer)"/>

  <!-- Inside Clipped Area -->
  <g clip-path="url(#inner-circle-clip)">
    <!-- Base Layer: Deep Rich Teal Paper (#1b687b) -->
    <rect x="50" y="30" width="400" height="420" fill="#1b687b"/>

    <!-- Constellation / Migration Paths in Teal Sky -->
    <!-- Upper Path -->
    <path d="M 215 72 C 255 58, 290 85, 345 102 C 375 110, 400 120, 420 142" 
          fill="none" 
          stroke="#104350" 
          stroke-width="3" 
          stroke-dasharray="4, 5" 
          stroke-linecap="round"/>

    <!-- Lower Path around Right Eye -->
    <path d="M 268 214 C 298 230, 312 268, 338 292 C 362 314, 390 320, 422 332" 
          fill="none" 
          stroke="#104350" 
          stroke-width="3" 
          stroke-dasharray="4, 5" 
          stroke-linecap="round"/>

    <!-- Glowing Cyan/Mint Waypoint Dots (#7ef5d2) -->
    <g filter="url(#glow-mint)">
      <!-- Upper path dots -->
      <circle cx="218" cy="73" r="4.5" fill="#7ef5d2"/>
      <circle cx="272" cy="65" r="5" fill="#7ef5d2"/>
      <circle cx="342" cy="102" r="4.5" fill="#7ef5d2"/>
      <circle cx="415" cy="138" r="4.5" fill="#7ef5d2"/>

      <!-- Lower path dots -->
      <circle cx="270" cy="215" r="4" fill="#7ef5d2"/>
      <circle cx="310" cy="270" r="4.5" fill="#7ef5d2"/>
      <circle cx="340" cy="294" r="4" fill="#7ef5d2"/>
      <circle cx="380" cy="316" r="4.5" fill="#7ef5d2"/>
      <circle cx="420" cy="330" r="4.5" fill="#7ef5d2"/>
    </g>

    <!-- Slate Grey Paper Silhouette Layer (#7a879a) -->
    <path d="M 250 50 
             A 185 185 0 0 0 65 235 
             C 65 315, 115 378, 175 410 
             C 175 365, 182 320, 202 285 
             C 188 275, 160 270, 142 258 
             C 175 250, 202 230, 218 195 
             C 228 170, 238 105, 250 50 Z" 
          fill="#7a879a" 
          filter="url(#shadow-layer)"/>

    <!-- Dark Navy Dividing Contour Line -->
    <path d="M 250 50 
             C 238 105, 228 170, 218 195 
             C 202 230, 175 250, 142 258 
             C 160 270, 188 275, 202 285 
             C 182 320, 175 365, 175 410" 
          fill="none" 
          stroke="#1c204b" 
          stroke-width="11" 
          stroke-linejoin="round" 
          stroke-linecap="round"/>

    <!-- Center Small Bird Silhouette (#8592a4) -->
    <g filter="url(#shadow-layer)">
      <path d="M 268 285 
               C 255 245, 228 242, 208 252 
               L 186 260 
               L 204 272 
               C 202 290, 205 315, 216 340 
               L 272 340 
               C 276 320, 274 300, 268 285 Z" 
            fill="#8592a4" 
            stroke="#1c204b" 
            stroke-width="9" 
            stroke-linejoin="round"/>
      <!-- Small Bird Navy Eye Dot -->
      <circle cx="225" cy="258" r="6" fill="#1c204b"/>
    </g>

    <!-- Top-Left Expressive Eye -->
    <g filter="url(#shadow-eye)">
      <!-- White Eyeball -->
      <circle cx="152" cy="150" r="46" fill="#ffffff" stroke="#1c204b" stroke-width="9"/>
      <!-- Navy Pupil (looking up-left) -->
      <circle cx="138" cy="138" r="20" fill="#1c204b"/>
      <!-- Catchlight Reflection Notch -->
      <circle cx="147" cy="131" r="5" fill="#ffffff"/>
    </g>

    <!-- Right Large Owl Eye -->
    <g filter="url(#shadow-eye)">
      <!-- Massive White Eyeball -->
      <circle cx="360" cy="225" r="68" fill="#ffffff" stroke="#1c204b" stroke-width="11"/>
      <!-- Navy Pupil (looking left) -->
      <circle cx="338" cy="225" r="27" fill="#1c204b"/>
      <!-- Catchlight Reflection -->
      <path d="M 346 215 A 11 11 0 0 1 346 235 A 7 7 0 0 0 346 215 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Location Pin at Bottom (#ffffff with dark navy border) -->
  <g filter="url(#shadow-pin)">
    <path d="M 250 460 
             L 202 380 
             A 54 54 0 1 1 298 380 
             Z" 
          fill="#ffffff" 
          stroke="#1c204b" 
          stroke-width="11" 
          stroke-linejoin="round"/>
    <!-- Hollow Pin Center Circle -->
    <circle cx="250" cy="360" r="17" fill="#1c204b"/>
  </g>
</svg>
